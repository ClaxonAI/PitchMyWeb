name: Deploy

# Deploys main to production once CI has passed on it; also runnable by hand
# from the Actions tab ("Run workflow").
#
# AWS access is keyless: GitHub's OIDC token is exchanged for a short-lived
# session on the pitchmyweb-github-deploy role, which only this repository's
# main branch may assume and which can only upload the deploy package and run
# the deploy on the app server. infrastructure/aws/setup-github-deploy.ps1
# creates the role. Its ARN is below; the repository variable
# AWS_DEPLOY_ROLE_ARN overrides it (e.g. after moving to another account).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer one waits for the running one rather than
# cutting it off mid-build.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip if main has moved on
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$(git rev-parse HEAD)" ]; then
            echo "main is now at $latest; the deploy for that commit will run instead."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Prints who GitHub says this run is (not the token itself): the role's
      # trust policy must match these claims exactly, and when it does not,
      # AWS says only "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      - name: Show the identity AWS will see
        if: steps.current.outputs.skip != 'true'
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{sub, aud, repository, ref, event_name, job_workflow_ref}'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.current.outputs.skip != 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::491521241125:role/pitchmyweb-github-deploy' }}
          aws-region: ap-south-1

      - name: Deploy
        if: steps.current.outputs.skip != 'true'
        run: bash infrastructure/aws/deploy.sh
