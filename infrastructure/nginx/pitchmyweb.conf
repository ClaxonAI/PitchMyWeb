# nginx for the production box. Terminates TLS and forwards to the three
# Next.js services PM2 runs on localhost.
#
#   sudo cp infrastructure/nginx/pitchmyweb.conf /etc/nginx/sites-available/pitchmyweb
#   sudo ln -s /etc/nginx/sites-available/pitchmyweb /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d pitchmyweb.in -d api.pitchmyweb.in -d preview.pitchmyweb.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot rewrites the listen/ssl lines itself, so the blocks below are written
# for plain :80 and left for it to upgrade.
#
# Note on Clerk: clerk.pitchmyweb.in is NOT served here. It is a CNAME pointing
# at Clerk's own infrastructure and must stay "DNS only" in Cloudflare.

# Forwarded headers, needed by Clerk and by Next.js to build absolute URLs.
# Without X-Forwarded-Proto the apps think they are on http:// behind the TLS
# terminator and can emit insecure redirects.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_http_version 1.1;
proxy_read_timeout 120s;

# ---------------------------------------------------------------- dashboard
server {
    listen 80;
    server_name pitchmyweb.in www.pitchmyweb.in;

    # Demo recordings are uploaded through the API; the default 1m is too small.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# --------------------------------------------------------------------- api
server {
    listen 80;
    server_name api.pitchmyweb.in;

    client_max_body_size 25m;

    # Server-Sent Events: campaign run progress and the WhatsApp link screen
    # both stream over these. nginx buffers proxied responses by default, which
    # holds the events until the buffer fills — the dashboard then shows a
    # search stuck at "Queued…" that is actually running fine. Buffering off,
    # and a long read timeout so an idle stream is not cut.
    location ~ ^/api/(campaigns/[^/]+/executions/[^/]+/events|whatsapp/accounts/[^/]+/events) {
        proxy_pass http://127.0.0.1:4000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
    }
}

# ------------------------------------------------------------------- sites
# The public demo sites. This is the only hostname strangers reach: the
# /s/<slug> links sent to businesses over WhatsApp resolve here, so it has to
# work from a phone on mobile data, not just from inside the VPC.
server {
    listen 80;
    server_name preview.pitchmyweb.in;

    location / {
        proxy_pass http://127.0.0.1:3200;
    }
}
